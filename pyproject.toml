[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG — monolithic service with deep research, voice, MCP"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Database — PostgreSQL
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Vector DB
    "qdrant-client>=1.12.0",

    # Queue
    "aio-pika>=9.4.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "authlib>=1.3.2",
    "httpx>=0.27.0",

    # LLM / AI
    "openai>=1.55.0",          # OpenRouter is OpenAI-compatible
    "langgraph>=0.2.50",
    "langchain>=0.3.10",
    "langchain-openai>=0.2.10",
    "langchain-community>=0.3.10",
    "tiktoken>=0.8.0",

    # Document parsing — chunking
    "pymupdf>=1.24.14",        # PDF parsing
    "python-docx>=1.1.2",      # DOCX parsing
    "pdfplumber>=0.11.4",      # PDF table extraction
    "openpyxl>=3.1.5",         # Excel
    "markdown-it-py>=3.0.0",   # Markdown

    # Web search
    "firecrawl-py>=1.4.0",

    # Voice
    "faster-whisper>=1.0.0",   # STT — local Whisper (CTranslate2), CPU int8 or GPU fp16
    "nvidia-cublas-cu12",      # CTranslate2 GPU backend (WHISPER_DEVICE=cuda) — pip-only CUDA libs,
    "nvidia-cudnn-cu12",       # avoids needing a full nvidia/cuda base image (see Dockerfile LD_LIBRARY_PATH)
    "aiofiles>=24.1.0",

    # MCP
    "mcp>=1.1.0",

    # Monitoring
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",

    # Utilities
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "cachetools>=5.5.0",
    "anyio>=4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
