syntax = "proto3";

package agentic.document;

option py_generic_services = false;

// ─── Messages ───────────────────────────────────────────────────────────────

message IngestRequest {
  string kb_id       = 1;
  string user_id     = 2;
  string filename    = 3;
  bytes  content     = 4;   // raw file bytes (for small files)
  string file_url    = 5;   // or a presigned URL
  IngestConfig config = 6;
}

message IngestConfig {
  int32  chunk_token_num     = 1;
  int32  chunk_overlap_pct   = 2;
  int32  table_context_size  = 3;
  string delimiter           = 4;
}

message IngestProgressChunk {
  string job_id     = 1;
  string stage      = 2;   // "parsing" | "chunking" | "embedding" | "indexing" | "done"
  float  progress   = 3;   // 0.0 → 1.0
  int32  chunks_done = 4;
  int32  chunks_total = 5;
  string error      = 6;
  bool   done       = 7;
}

message DocumentListRequest {
  string kb_id   = 1;
  string user_id = 2;
  int32  limit   = 3;
  int32  offset  = 4;
}

message DocumentListResponse {
  repeated DocumentMeta documents = 1;
  int32 total = 2;
}

message DocumentMeta {
  string id          = 1;
  string kb_id       = 2;
  string filename    = 3;
  string status      = 4;
  int32  chunk_count = 5;
  int64  created_at  = 6;
  int64  updated_at  = 7;
}

message DeleteDocumentRequest {
  string document_id = 1;
  string user_id     = 2;
}

message DeleteDocumentResponse {
  bool success = 1;
  string message = 2;
}

// ─── Service ────────────────────────────────────────────────────────────────

service DocumentService {
  // Server-streaming: progress events during ingestion
  rpc IngestDocument(IngestRequest) returns (stream IngestProgressChunk);
  rpc ListDocuments(DocumentListRequest) returns (DocumentListResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
}
