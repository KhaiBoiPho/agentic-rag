syntax = "proto3";

package agentic.chat;

option py_generic_services = false;

// ─── Messages ───────────────────────────────────────────────────────────────

message ChatRequest {
  string conversation_id = 1;
  string kb_id           = 2;   // knowledge base to search against
  string message         = 3;
  string user_id         = 4;
  ChatConfig config      = 5;
}

message ChatConfig {
  string model           = 1;
  float  temperature     = 2;
  int32  max_tokens      = 3;
  bool   use_rag         = 4;
  int32  top_k           = 5;
  float  score_threshold = 6;
}

message ChatStreamChunk {
  string delta           = 1;   // partial text token
  string chunk_id        = 2;
  ChunkType type         = 3;
  repeated RagSource sources = 4;  // populated in the final chunk
  string error           = 5;
  bool   done            = 6;
}

enum ChunkType {
  TOKEN   = 0;
  SOURCE  = 1;
  ERROR   = 2;
  DONE    = 3;
}

message RagSource {
  string chunk_id     = 1;
  string document_id  = 2;
  string document_name = 3;
  string content      = 4;
  float  score        = 5;
  int32  page_num     = 6;
}

message ChatHistoryRequest {
  string conversation_id = 1;
  int32  limit           = 2;
  int32  offset          = 3;
}

message ChatHistoryResponse {
  repeated ChatMessage messages = 1;
  int32 total = 2;
}

message ChatMessage {
  string id              = 1;
  string role            = 2;
  string content         = 3;
  int64  created_at      = 4;
  repeated RagSource sources = 5;
}

// ─── Service ────────────────────────────────────────────────────────────────

service ChatService {
  // Server-streaming: yields token chunks until done=true
  rpc StreamChat(ChatRequest) returns (stream ChatStreamChunk);
  rpc GetHistory(ChatHistoryRequest) returns (ChatHistoryResponse);
}
