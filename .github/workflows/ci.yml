name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ─── Backend lint + type check ──────────────────────────────────────────────
  lint:
    name: Lint & Format (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff mypy

      - name: ruff lint
        run: ruff check app/

      - name: ruff format check
        run: ruff format --check app/

  # ─── Frontend type check + build ────────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─── Backend tests ───────────────────────────────────────────────────────────
  test:
    name: Tests (Backend)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentic_rag_test
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic -d agentic_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    env:
      APP_ENV: test
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://agentic:agentic_secret@localhost:5432/agentic_rag_test
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SECRET_KEY: ci-test-jwt-secret
      OPENROUTER_API_KEY: sk-or-dummy
      OPENROUTER_EMBED_MODEL: openai/text-embedding-3-small
      PROMETHEUS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (with dev extras)
        run: pip install -e ".[dev]"

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ─── Docker build smoke test ─────────────────────────────────────────────────
  docker-build:
    name: Docker Build (smoke test)
    runs-on: ubuntu-latest
    needs: [lint, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (cache check)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: agentic-rag-app:ci

      - name: Build frontend image (cache check)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: agentic-rag-ui:ci
